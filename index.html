<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informatika Kelas XI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    --bg: #FFFFFF;
    --bg-sidebar: #FBFBFA;
    --text: #37352F;
    --muted: #787774;
    --border: #EBEBEA;
    --hover: #F1F1EF;
    --accent: #2383E2;
    --accent-soft: #E7F3FE;
    --sidebar-w: 260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    min-height:100vh;
    font-size:15px;
  }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    padding:14px 12px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    overflow-x:hidden;
    transition:width .16s ease, padding .16s ease;
    white-space:nowrap;
  }
  #sidebar.collapsed{
    width:0;
    padding-left:0;
    padding-right:0;
    border-right:none;
  }
  #sidebar.collapsed *{opacity:0;pointer-events:none}

  .sidebar-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 8px 14px;
  }
  .ws-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    font-size:15px;
  }
  #collapse-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--muted);
    font-size:15px;
    padding:4px 6px;
    border-radius:5px;
    line-height:1;
  }
  #collapse-btn:hover{background:var(--hover)}

  #open-sidebar-btn{
    display:none;
    position:fixed;
    top:16px;
    left:14px;
    z-index:15;
    background:#fff;
    border:1px solid var(--border);
    border-radius:6px;
    padding:7px 9px;
    font-size:14px;
    cursor:pointer;
    color:var(--muted);
    box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  #open-sidebar-btn.show{display:block}

  #cari-wrap{padding:0 4px 14px}
  #cari{
    width:100%;
    padding:7px 10px;
    border:1px solid var(--border);
    border-radius:6px;
    font-family:inherit;
    font-size:13px;
    background:#fff;
    color:var(--text);
  }
  #cari:focus{outline:none;border-color:var(--accent)}
  .nav-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border-radius:6px;
    color:var(--muted);
    font-size:13.5px;
    cursor:pointer;
    font-weight:500;
    user-select:none;
  }
  .nav-item:hover{background:var(--hover)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent)}
  .nav-section-label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    padding:14px 8px 4px;
    font-weight:600;
  }
  .nav-sub{
    padding:5px 8px 5px 26px;
    font-size:13px;
    color:var(--muted);
    border-radius:6px;
    cursor:pointer;
  }
  .nav-sub:hover{background:var(--hover)}
  .nav-sub.active{background:var(--accent-soft);color:var(--accent);font-weight:500}

  /* ---------- MAIN ---------- */
  main{
    flex:1;
    max-width:920px;
    margin:0 auto;
    padding:56px 48px 100px;
    min-width:0;
  }
  .cover-emoji{font-size:52px;line-height:1}
  h1{
    font-size:32px;
    font-weight:700;
    margin-top:12px;
    letter-spacing:-.02em;
  }
  .page-meta{
    color:var(--muted);
    font-size:14px;
    margin-top:8px;
  }
  .divider{
    border:none;
    border-top:1px solid var(--border);
    margin:26px 0 30px;
  }

  .semester-block{margin-bottom:32px}
  .semester-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 4px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
    font-size:16px;
    margin-bottom:14px;
  }
  .semester-header:hover{background:var(--hover)}
  .chevron{
    display:inline-block;
    transition:transform .15s;
    color:var(--muted);
    font-size:12px;
    width:14px;
  }
  .semester-header.collapsed .chevron{transform:rotate(-90deg)}
  .semester-count{
    color:var(--muted);
    font-weight:400;
    font-size:13px;
  }

  /* ---------- GALLERY CARDS ---------- */
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:16px;
  }
  .card{
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    color:var(--text);
    background:#fff;
    display:flex;
    flex-direction:column;
    transition:transform .15s, box-shadow .15s;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
  }
  .card-image{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    display:block;
    background:var(--hover);
  }
  .card-image-fallback{
    width:100%;
    aspect-ratio:4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
  }
  .card-label{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 13px;
    border-top:1px solid var(--border);
  }
  .card-icon{font-size:14px;flex-shrink:0}
  .card-title{
    font-size:12.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .kosong{
    color:var(--muted);
    font-size:13.5px;
    padding:16px 4px;
  }

  /* mobile */
  #menu-btn{display:none}
  @media (max-width:820px){
    #sidebar{
      position:fixed;
      left:-280px;
      z-index:20;
      width:260px;
      transition:left .18s;
      box-shadow:0 0 0 2000px rgba(0,0,0,0);
    }
    #sidebar.open{left:0;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
    #sidebar.open *{opacity:1;pointer-events:auto}
    #sidebar.collapsed{width:260px;padding:14px 12px}
    #collapse-btn{display:none}
    #open-sidebar-btn{display:none !important}
    #menu-btn{
      display:flex;
      align-items:center;
      gap:6px;
      position:fixed;
      top:14px;
      left:14px;
      z-index:10;
      background:#fff;
      border:1px solid var(--border);
      border-radius:6px;
      padding:7px 10px;
      font-size:13px;
      cursor:pointer;
      font-family:inherit;
    }
    main{padding:70px 20px 80px}
    .gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  }
</style>
</head>
<body>

<button id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
<button id="open-sidebar-btn" onclick="bukaSidebar()">☰</button>

<nav id="sidebar">
  <div class="sidebar-top">
    <div class="ws-title">📘 Informatika XI</div>
    <button id="collapse-btn" onclick="tutupSidebar()" title="Tutup sidebar">«</button>
  </div>
  <div id="cari-wrap">
    <input id="cari" type="text" placeholder="Cari materi...">
  </div>
  <div class="nav-item active" data-filter="semua">🏠 Semua Materi</div>

  <div class="nav-section-label">Semester 1</div>
  <div id="nav-s1"></div>

  <div class="nav-section-label">Semester 2</div>
  <div id="nav-s2"></div>
</nav>

<main>
  <div class="cover-emoji">📘</div>
  <h1>Informatika Kelas XI</h1>
  <div class="page-meta" id="meta-info">Memuat materi...</div>
  <hr class="divider">

  <div id="konten"></div>
</main>

<script>
let semuaModul = [];
let filterAktif = 'semua';   // semua | 1 | 2
let kategoriAktif = null;
let collapsedState = {};

const GRADIENTS = [
  'linear-gradient(135deg,#FDE9C8,#FBCFE8)',
  'linear-gradient(135deg,#D7F2E3,#BAE6C9)',
  'linear-gradient(135deg,#DDEBFF,#C7DDFF)',
  'linear-gradient(135deg,#FFE8D6,#FFD3B0)',
  'linear-gradient(135deg,#E9E3FF,#D6CCFF)',
  'linear-gradient(135deg,#FFE0E8,#FFC2D1)'
];

function tutupSidebar(){
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('open-sidebar-btn').classList.add('show');
  localStorage.setItem('sidebarCollapsed', '1');
}
function bukaSidebar(){
  document.getElementById('sidebar').classList.remove('collapsed');
  document.getElementById('open-sidebar-btn').classList.remove('show');
  localStorage.setItem('sidebarCollapsed', '0');
}
if(localStorage.getItem('sidebarCollapsed') === '1' && window.innerWidth > 820){
  tutupSidebar();
}

async function muatData(){
  try{
    // Semua data materi (judul, deskripsi, kategori, semester, gambar, status tampil)
    // diambil langsung dari tab "Materi" di Google Sheet.
    const res = await fetch(CONTROL_URL + '?t=' + Date.now());
    const semuaBaris = await res.json();

    semuaModul = semuaBaris.filter(m => m.tampilkan === true);

    buatNavKategori();
    render();
  }catch(err){
    document.getElementById('konten').innerHTML =
      '<p class="kosong">Gagal memuat data dari Google Sheet. Pastikan CONTROL_URL di config.js sudah diisi dan Apps Script sudah di-deploy.</p>';
    console.error(err);
  }
}

function buatNavKategori(){
  const kategoriS1 = [...new Set(semuaModul.filter(m=>m.semester==='1').map(m=>m.category))];
  const kategoriS2 = [...new Set(semuaModul.filter(m=>m.semester==='2').map(m=>m.category))];

  document.getElementById('nav-s1').innerHTML = kategoriS1.map(k =>
    `<div class="nav-sub" data-sem="1" data-kat="${k}">${k}</div>`
  ).join('') || '<div class="nav-sub" style="opacity:.5">Belum ada materi</div>';

  document.getElementById('nav-s2').innerHTML = kategoriS2.map(k =>
    `<div class="nav-sub" data-sem="2" data-kat="${k}">${k}</div>`
  ).join('') || '<div class="nav-sub" style="opacity:.5">Belum ada materi</div>';

  document.querySelectorAll('.nav-sub').forEach(el=>{
    el.onclick = ()=>{
      filterAktif = el.dataset.sem;
      kategoriAktif = el.dataset.kat;
      setActiveNav(el);
      render();
    };
  });

  document.querySelector('.nav-item[data-filter="semua"]').onclick = (e)=>{
    filterAktif = 'semua';
    kategoriAktif = null;
    setActiveNav(e.currentTarget);
    render();
  };
}

function setActiveNav(el){
  document.querySelectorAll('.nav-item, .nav-sub').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  if(window.innerWidth<=820) document.getElementById('sidebar').classList.remove('open');
}

function render(){
  const kataKunci = document.getElementById('cari').value.toLowerCase();

  const cocok = (m) => {
    const cocokSem = filterAktif==='semua' || m.semester===filterAktif;
    const cocokKat = !kategoriAktif || m.category===kategoriAktif;
    const cocokCari = m.title.toLowerCase().includes(kataKunci) || (m.description||'').toLowerCase().includes(kataKunci);
    return cocokSem && cocokKat && cocokCari;
  };

  const hasil = semuaModul.filter(cocok);
  document.getElementById('meta-info').textContent = `Kelas XI · ${semuaModul.length} materi total`;

  const grup1 = hasil.filter(m=>m.semester==='1');
  const grup2 = hasil.filter(m=>m.semester==='2');

  let html = '';
  html += buatBlokSemester('1', 'Semester 1', grup1);
  html += buatBlokSemester('2', 'Semester 2', grup2);

  if(hasil.length===0){
    html = '<p class="kosong">Tidak ada materi yang cocok dengan pencarian.</p>';
  }

  document.getElementById('konten').innerHTML = html;

  document.querySelectorAll('.semester-header').forEach(h=>{
    h.onclick = ()=>{
      const key = h.dataset.sem;
      collapsedState[key] = !collapsedState[key];
      render();
    };
  });
}

function buatKartu(m, idx){
  const gradien = GRADIENTS[idx % GRADIENTS.length];
  const gambar = (m.image || '').trim();

  const gambarHtml = gambar
    ? `<img class="card-image" src="${gambar}" alt="${m.title}" loading="lazy"
         onerror="this.outerHTML='<div class=&quot;card-image-fallback&quot; style=&quot;background:${gradien}&quot;>${m.icon || '📄'}</div>'">`
    : `<div class="card-image-fallback" style="background:${gradien}">${m.icon || '📄'}</div>`;

  return `
    <a class="card" href="${m.file}" target="_blank" rel="noopener">
      ${gambarHtml}
      <div class="card-label">
        <span class="card-icon">${m.icon || '📄'}</span>
        <span class="card-title">${m.title}</span>
      </div>
    </a>
  `;
}

function buatBlokSemester(kode, label, daftar){
  if(filterAktif!=='semua' && filterAktif!==kode) return '';
  const collapsed = collapsedState[kode] ? 'collapsed' : '';
  const kartu = daftar.length
    ? `<div class="gallery">${daftar.map((m,i)=>buatKartu(m,i)).join('')}</div>`
    : '<p class="kosong">Belum ada materi di semester ini.</p>';

  return `
    <div class="semester-block">
      <div class="semester-header ${collapsed}" data-sem="${kode}">
        <span class="chevron">▾</span>
        <span>${label}</span>
        <span class="semester-count">${daftar.length} materi</span>
      </div>
      <div style="${collapsedState[kode] ? 'display:none' : ''}">
        ${kartu}
      </div>
    </div>
  `;
}

document.getElementById('cari').addEventListener('input', render);
muatData();
</script>

</body>
</html>
