<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kuis Algoritma Dasar</title>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#FFFFFF;color:#37352F;padding:0;margin:0}
  #konten-utama{visibility:hidden;padding:40px;max-width:600px;margin:0 auto}
  button{margin:6px 6px 0 0;padding:10px 16px;background:#F7F6F3;border:1px solid #E9E9E7;border-radius:6px;cursor:pointer}
  button:hover{background:#EFEFED}
  a{color:#2383E2}
</style>
</head>
<body>
  <div id="konten-utama">
    <h1>🧠 Kuis: Konsep Dasar Algoritma</h1>
    <p id="soal">Apa yang dimaksud dengan algoritma?</p>
    <button onclick="jawab(true)">Urutan langkah logis untuk menyelesaikan masalah</button><br>
    <button onclick="jawab(false)">Bahasa pemrograman komputer</button>
    <p id="skor">Skor: 0</p>
    <p><a href="../index.html">&larr; Kembali ke Portal</a></p>
  </div>

  <script>const MODUL_ID = "INF-102";</script>
  <script src="../config.js"></script>
  <script src="../guard.js"></script>
  <script>
    let skor = 0;
    function jawab(benar){
      if(benar) skor++;
      document.getElementById('skor').textContent = 'Skor: ' + skor;
    }
  </script>
</body>
</html>
