<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sistem Bilangan Biner</title>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#FFFFFF;color:#37352F;padding:0;margin:0}
  #konten-utama{visibility:hidden;padding:40px;max-width:600px;margin:0 auto}
  input{padding:8px;border:1px solid #E9E9E7;border-radius:6px;width:150px}
  a{color:#2383E2}
</style>
</head>
<body>
  <div id="konten-utama">
    <h1>💾 Sistem Bilangan Biner</h1>
    <p>Masukkan angka desimal, lihat hasil binernya:</p>
    <input type="number" id="desimal" value="10" oninput="konversi()">
    <p id="hasil"></p>
    <p><a href="../index.html">&larr; Kembali ke Portal</a></p>
  </div>

  <script>const MODUL_ID = "INF-103";</script>
  <script src="../config.js"></script>
  <script src="../guard.js"></script>
  <script>
    function konversi(){
      const n = document.getElementById('desimal').value;
      document.getElementById('hasil').textContent = 'Biner: ' + (parseInt(n)||0).toString(2);
    }
    konversi();
  </script>
</body>
</html>
